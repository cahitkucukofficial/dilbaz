<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dilbaz</title>
<meta name="theme-color" content="#2F6BFF">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Düzen fikri: tek sütun mobil uygulama, ortalanmış 430px çerçeve; yol zigzag, ders ekranı tam kaplama */
:root{
  --bg:#F3F6FB; --card:#FFFFFF; --ink:#18212F; --mute:#6B778C; --line:#DDE4EF;
  --brand:#2F6BFF; --brand-d:#1E4FD1; --good:#19A56B; --good-bg:#DDF6EA; --bad:#E5484D; --bad-bg:#FDE4E4;
  --gold:#F5A524; --lock:#C9D1DE; --lock-d:#B2BCCC;
  --f:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1521; --card:#182131; --ink:#EEF2F9; --mute:#98A4BA; --line:#2A364B;
  --brand:#5C8DFF; --brand-d:#3B6AE0; --good:#34C98A; --good-bg:#15382B; --bad:#FF6B70; --bad-bg:#3C1D21;
  --lock:#2C384D; --lock-d:#222C3E; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1521; --card:#182131; --ink:#EEF2F9; --mute:#98A4BA; --line:#2A364B;
  --brand:#5C8DFF; --brand-d:#3B6AE0; --good:#34C98A; --good-bg:#15382B; --bad:#FF6B70; --bad-bg:#3C1D21;
  --lock:#2C384D; --lock-d:#222C3E; color-scheme:dark;}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:700;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:8px;border-bottom:2px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:center;gap:6px;font-weight:900;font-size:20px;color:var(--brand)}
.stats{display:flex;gap:14px;font-weight:900;font-size:16px}
.stat{display:flex;align-items:center;gap:4px}
.stat.fire{color:var(--gold)}.stat.xp{color:var(--brand)}.stat.heart{color:var(--bad)}
main{flex:1;overflow-y:auto;padding-bottom:16px}
.tabs{display:flex;border-top:2px solid var(--line);background:var(--card)}
.tab{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--mute)}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--brand)}
.unit{margin:16px;padding:14px 16px;border-radius:16px;background:var(--brand);color:#fff;border-bottom:4px solid var(--brand-d)}
.unit small{display:block;font-size:12px;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.unit b{font-size:20px;font-weight:900}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:8px 0 20px}
.node{position:relative;width:84px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:34px;
  background:var(--brand);box-shadow:0 7px 0 var(--brand-d);transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--brand-d)}
.node.done{background:var(--gold);box-shadow:0 7px 0 #C98511}
.node.lock{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);filter:grayscale(1);opacity:.85}
.node .lbl{position:absolute;top:100%;margin-top:14px;font-size:13px;font-weight:800;color:var(--mute);white-space:nowrap}
.start{position:absolute;bottom:100%;margin-bottom:10px;background:var(--card);color:var(--brand);border:2px solid var(--line);padding:6px 12px;border-radius:12px;font-size:14px;font-weight:900;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
.start::after{content:"";position:absolute;left:50%;top:100%;width:12px;height:12px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.pad{padding:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
h2{font-size:22px;font-weight:900;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:2px solid var(--line)}
.row:last-child{border:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:900}
.row.me{background:var(--good-bg);border-radius:12px;border-bottom:0;padding-inline:10px}
.row .n{flex:1}.row .x{color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.tile small{display:block;color:var(--mute);font-size:12px}.tile b{font-size:22px;font-weight:900}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--brand);color:#fff;font-weight:900;font-size:16px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 var(--brand-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-d)}
.btn:disabled{background:var(--lock);color:var(--mute);box-shadow:0 4px 0 var(--lock-d);cursor:not-allowed}
.btn.ghost{background:none;color:var(--brand);box-shadow:none;border:2px solid var(--line)}
.btn.good{background:var(--good);box-shadow:0 4px 0 #0F7B4E}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 #B0282D}
/* ders ekranı */
#lesson{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5}
#lesson.on{display:flex}
.lh{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x-btn{font-size:26px;color:var(--mute);line-height:1;padding:4px 8px}
.bar{flex:1;height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:8px;transition:width .3s;box-shadow:inset 0 5px 0 rgba(255,255,255,.25)}
.lb{flex:1;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:16px}
.q{font-size:22px;font-weight:900;line-height:1.25;text-wrap:balance}
.big{font-size:76px;text-align:center;padding:6px 0}
.opts{display:grid;gap:10px}
.opt{padding:14px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--card);font-size:18px;text-align:left;display:flex;gap:12px;align-items:center}
.opt kbd{font:inherit;font-size:13px;border:2px solid var(--line);border-radius:8px;padding:1px 7px;color:var(--mute)}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card));color:var(--brand)}
.opt.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.ans{min-height:64px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:10px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);font-size:17px}
.chip.used{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .opt{justify-content:center;text-align:center;padding:14px 8px}
.opt.gone{opacity:.25;pointer-events:none}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lf{padding:16px 20px 22px;border-top:2px solid var(--line);background:var(--bg);transition:background .2s}
.lf.good{background:var(--good-bg);border-color:transparent}.lf.bad{background:var(--bad-bg);border-color:transparent}
.fb{font-size:20px;font-weight:900;margin-bottom:10px}
.lf.good .fb{color:var(--good)}.lf.bad .fb{color:var(--bad)}
.fb small{display:block;font-size:15px;font-weight:700;margin-top:2px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.center h1{font-size:28px;font-weight:900}
.center p{color:var(--mute);font-size:16px}
.res{display:flex;gap:10px;width:100%}.res .tile{flex:1;text-align:center}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;white-space:nowrap}
.say{align-self:center;width:96px;height:96px;border-radius:50%;background:var(--brand);box-shadow:0 6px 0 var(--brand-d);font-size:42px;display:grid;place-items:center}
.say:active{transform:translateY(4px);box-shadow:0 2px 0 var(--brand-d)}
.grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bdg{text-align:center;padding:10px 4px}.bdg span{font-size:28px;display:block}.bdg small{font-size:11px;line-height:1.2}
.bdg.off{filter:grayscale(1);opacity:.4}
.ti{width:100%;padding:14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;font:inherit;font-size:20px;background:var(--card);color:var(--ink)}
.ti:focus{outline:none;border-color:var(--brand)}
#mic.rec{animation:pulse 1s infinite;background:var(--bad);box-shadow:0 6px 0 #B0282D}
@keyframes pulse{50%{transform:scale(1.08)}}
.lbl{text-align:center}.crs{font-size:12px;letter-spacing:2px}
.lvl{font-size:12px;font-weight:900;color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,transparent);padding:3px 8px;border-radius:10px;white-space:nowrap}
.fchip{padding:6px 12px;border:2px solid var(--line);border-radius:20px;font-size:13px;background:var(--card)}
.fchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mf{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mas{display:flex;align-items:center;gap:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 if(W.got)S.lastActive=day(0);save();
 $('#lesson').innerHTML=`<div class="center"><div style="color:var(--brand)">${bird(96,'happy')}</div><h1>${hit?'Günlük kelime hedefi tamam!':'Güzel iş!'}</h1><p>${bump?`Seri ${S.streak} gün. `:''}Şimdi cümle pratiğiyle pekiştir.</p>
 <div class="res"><div class="tile"><small>Bugün</small><b style="color:var(--brand)">${S.wToday}/${S.wGoal}</b></div><div class="tile"><small>Toplam kelime</small><b style="color:var(--good)">${S.learned.length}</b></div><div class="tile"><small>XP</small><b>+${earn}</b></div></div></div>
 <div class="lf"><button class="btn good" data-act="close">Devam</button></div>`;
}

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 const d=t.dataset;
 if(d.say){speak(d.say);return}
 if(d.act==='remtoggle'){(async()=>{
  S.rem=S.rem||{on:false,t:'19:00',last:''};
  if(S.rem.on){S.rem.on=false}
  else{let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();S.rem.on=p==='granted';if(!S.rem.on)alert('Bildirim izni verilmedi.');else{S.rem.last='';remShow('Dilbaz 🐦','Hatırlatma açıldı: her gün '+S.rem.t+' sonrası.')}}
  save();render()})();return}
 if(d.act==='remtest'){(async()=>{let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();if(p==='granted')remShow('Dilbaz 🐦','Deneme bildirimi: çalışıyor!');else alert('Bildirim izni verilmedi.');render()})();return}
 if(d.act==='saveprof'){const g=i=>{const e=document.getElementById(i);return e?e.value.trim():null};
  const n=g('pn'),c=g('pc'),b=g('pb');if(n!==null)S.name=n;if(c!==null)S.city=c;if(b!==null)S.bio=b;save();
  const bt=document.getElementById('psave');if(bt){bt.textContent='Kaydedildi ✓';setTimeout(()=>{const x=document.getElementById('psave');if(x)x.textContent='Kaydet'},1600)}return}
 if(d.act==='pickphoto'){const f=document.getElementById('pf');if(f)f.click();return}
 if(d.act==='rmphoto'){S.photo='';save();render();return}
 if(d.act==='cards'){openPicker('cards');return}
 if(d.act==='sents'){openPicker('sents');return}
 if(d.sec){PM==='cards'?openCards(d.sec):openSents(d.sec);return}
 if(d.act==='free'){S.free=!S.free;save();render();return}
 if(W){
  if(d.act==='wflip'){W.flip=true;paintCard();speak(W.q[0].en);return}
  if(d.act==='wgot'){const w=W.q.shift();if(!S.learned.includes(w.en)){S.learned.push(w.en);S.box[w.en]={b:1,d:day(1)}}S.wToday++;W.got++;W.flip=false;save();paintCard();return}
  if(d.act==='wagain'){W.q.push(W.q.shift());W.flip=false;paintCard();return}
  if(d.act==='wquit'){closeLesson();return}
 }
 if(d.bf){BF=d.bf;render();return}
 if(d.wgoal){S.wGoal=+d.wgoal;save();render();return}
 if(d.level!==undefined){const first=!S.level,lv=+d.level;S.level=lv+1;S.done=[...new Set((first?[]:S.done).concat(['l1','l2','l3','l4','l5','l6'].slice(0,[0,3,6][lv])))];save();closeLesson();return}
 if(d.act==='level'){showLevel();return}
 if(d.act==='update'){updateApp();return}
 if(d.act==='qclaim'){const q=qToday().find(x=>x.id===d.q),st=qState();if(q&&q.ok&&!q.cl){st.cl.push(q.id);S.gems=(S.gems||0)+q.g;if(qToday().every(x=>x.cl)&&!st.cl.includes('all')){st.cl.push('all');S.gems+=5;toast('Bonus +5 💎')}else toast('+'+q.g+' 💎');save();render()}return}
 if(d.act==='qmonth'){const mo=monState();if(mo.l>=20&&!mo.c){mo.c=1;S.gems=(S.gems||0)+15;save();toast('+15 💎');render()}return}
 if(d.act==='gheart'){if(S.hearts>=5)toast('Kalpların dolu');else if((S.gems||0)<10)toast('10 💎 gerekli');else{S.gems-=10;S.hearts=5;save();toast('Kalpler yenilendi ❤️');render()}return}
 if(d.act==='gfreeze'){if((S.freezes||0)>=2)toast('En fazla 2 dondurucu taşıyabilirsin');else if((S.gems||0)<20)toast('20 💎 gerekli');else{S.gems-=20;S.freezes=(S.freezes||0)+1;save();toast('Seri dondurucu alındı ❄️');render()}return}
 if(d.act==='gheart2'){if((S.gems||0)>=10){S.gems-=10;S.hearts=5;save();closeLesson()}return}
 if(d.act==='buyfreeze'){if((S.freezes||0)>=2)toast('En fazla 2 dondurucu taşıyabilirsin');else if(S.xp<50)toast('50 XP gerekli');else{S.xp-=50;S.freezes=(S.freezes||0)+1;save();toast('Seri dondurucu alındı ❄️');render()}return}
 if(d.goal){S.goal=+d.goal;save();render();return}
 if(d.tab){S.tab=d.tab;render();return}
 if(d.accent!==undefined){S.accent=+d.accent;save();applyAccent();render();return}
 if(d.lesson){openLesson(d.lesson);return}
 if(d.act==='reset'){S={xp:120,streak:4,hearts:5,done:['l1'],today:false,tab:'me',accent:0,goal:20,day:'',todayXp:0,weak:[],learned:[],wToday:0,wGoal:5,free:false,box:{},name:'',city:'',bio:'',rem:{on:false,t:'19:00',last:''},photo:'',crowns:{},freezes:0,lastActive:'',note:'',log:{},stories:{},gems:0,qd:{d:'',cl:[]},mon:{m:'',l:0,c:0}};save();applyAccent();render();return}
 if(d.act==='close'){closeLesson();return}
 if(d.act==='quit'){closeLesson();return}
 if(d.act==='stories'){storyList();return}
 if(d.act==='sclose'){$('#lesson').classList.remove('on');render();return}
 if(d.act==='sopen'){storyRead(d.story);return}
 if(d.act==='stog'){const e=document.getElementById('tr'+d.k);if(e)e.style.display=e.style.display==='none'?'block':'none';return}
 if(d.act==='sq'){storyQuiz(d.story);return}
 if(d.act==='refill'){S.xp=Math.max(0,S.xp-20);S.hearts=5;save();closeLesson();return}
 if(!L)return;
 if(d.say){speak(d.say);return}
 if(d.act==='check'){check();return}
 if(d.act==='next'){next();return}
 if(d.mic!==undefined){listenMic();return}
 if(d.act==='skipq'){L.ok++;next();return}
 const q=L.qs[L.i];
 if(d.opt!==undefined&&L.state==='ask'){
  L.sel=+d.opt;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===t));paintFoot();return}
 if(d.w!==undefined&&q.t==='build'&&L.state==='ask'){L.built.push(+d.w);paintBuild();paintFoot();return}
 if(d.un!==undefined&&L.state==='ask'){L.built=L.built.filter(k=>k!==+d.un);paintBuild();paintFoot();return}
 if(d.m&&q.t==='match'&&L.state==='ask'){
  if(!L.mt||L.mt.s===d.m){L.mt={s:d.m,w:d.w};paintMatch();return}
  const en=d.m==='l'?d.w:L.mt.w,tr=d.m==='r'?d.w:L.mt.w;
  const ok=q.pairs.some(p=>p[0]===en&&p[1]===tr);
  if(ok){L.matched.push(en,tr);L.mt=null;paintMatch();
   if(L.matched.length===8){L.state=L.fail?'good':'good';L.ok++;L.first+=L.fail?0:1;const bar=document.querySelector('.bar i');bar.style.width=L.ok/L.total*100+'%';
    const f=$('#lf');f.className='lf good';f.innerHTML='<div class="mf" style="color:var(--brand)">'+bird(46,'happy')+'<div class="fb" style="margin:0">Harika!</div></div><button class="btn good" data-act="next">Devam</button>'}
  }else{
   L.fail=true;L.mt=null;if(!S.weak.includes(en))S.weak.push(en);S.hearts=Math.max(0,S.hearts-1);save();paintMatch();
   t.classList.add('shake');document.querySelector('.lh .heart').innerHTML=HEART+S.hearts;
   if(S.hearts<=0){setTimeout(()=>{L=null;showOut()},500)}
  }
 }
});
document.addEventListener('change',e=>{if(e.target.id==='pf')setPhoto(e.target.files[0]);if(e.target.id==='pn'){S.name=e.target.value.trim();save();render()}if(e.target.id==='rt'){S.rem=S.rem||{on:false,last:''};S.rem.t=e.target.value||'19:00';S.rem.last='';save()}if(e.target.id==='pc'){S.city=e.target.value.trim();save()}if(e.target.id==='pb'){S.bio=e.target.value.trim();save()}});
document.addEventListener('input',e=>{if(e.target.id==='bs'){BQ=e.target.value;paintBook()}});
document.addEventListener('input',e=>{if(L&&e.target.id==='ti'){L.typed=e.target.value;const b=document.querySelector('#lf .btn');if(b)b.disabled=!L.typed.trim()}});
document.addEventListener('keydown',e=>{
 if(!L||e.key!=='Enter')return;
 const b=document.querySelector('#lf .btn:not(:disabled)');if(b)b.click();
});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
applyAccent();render();if(!S.level)showLevel();
setInterval(remCheck,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)remCheck()});setTimeout(remCheck,1500);
if(S.note){toast(S.note);S.note='';save()}
</script>
</body>
</html>
